<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisualVault | Free Stock Media</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-accent: #00ab6b;
            --glass-bg: rgba(255, 255, 255, 0.2);
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-main);
            background-color: #ffffff;
            color: #1a1a1a;
            overflow-x: hidden;
        }

        /* Navbar */
        nav {
            position: absolute;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 4rem;
            z-index: 1000;
        }

        .logo { font-size: 1.8rem; font-weight: 800; color: white; cursor: pointer; text-decoration: none; }

        .nav-right { display: flex; align-items: center; gap: 20px; }
        .nav-right a, .nav-right select { 
            text-decoration: none; 
            color: white; 
            font-weight: 600; 
            font-size: 0.9rem;
            background: transparent;
            border: none;
            cursor: pointer;
        }

        .btn-join { color: white; border: 1px solid white !important; padding: 8px 18px; border-radius: 20px; }
        .btn-upload { background: var(--primary-accent); padding: 10px 22px; border-radius: 20px; border: none; color: white; font-weight: 600; cursor: pointer; }

        /* Hero Section */
        .hero {
            height: 580px;
            background: linear-gradient(rgba(0,0,0,0.25), rgba(0,0,0,0.4)), 
                        url('https://images.unsplash.com/photo-1542601906990-b4d3fb778b09?auto=format&fit=crop&w=1600&q=80');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }

        .hero h1 { color: white; font-size: 2.5rem; font-weight: 800; margin-bottom: 25px; padding: 0 20px; }

        /* Full Category Tabs List */
        .category-tabs { 
            display: flex; 
            gap: 15px; 
            margin-bottom: 20px; 
            flex-wrap: wrap; 
            justify-content: center;
            padding: 0 20px;
        }

        .cat-item {
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 6px 14px;
            border-radius: 20px;
            transition: var(--transition);
        }

        .cat-item.active { background: white; color: black; }
        .cat-item:hover:not(.active) { background: rgba(255,255,255,0.15); }

        /* Search Bar */
        .search-container { width: 100%; max-width: 850px; padding: 0 20px; }

        .search-box {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 50px;
            display: flex;
            width: 100%;
            padding: 6px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 15px 25px;
            font-size: 1.1rem;
            color: white;
            outline: none;
        }

        .search-box input::placeholder { color: rgba(255,255,255,0.85); }

        .search-box button {
            background: var(--primary-accent);
            border: none;
            padding: 10px 35px;
            border-radius: 50px;
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }

        .search-box button:hover { background: #008f5a; transform: scale(1.02); }

        /* Tag Pills */
        .tag-pills { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .pill {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(5px);
            padding: 6px 15px;
            border-radius: 6px;
            color: white;
            font-size: 0.85rem;
            text-decoration: none;
            transition: 0.2s;
        }
        .pill:hover { background: rgba(255,255,255,0.3); }

        /* Attribution */
        .attribution {
            position: absolute; bottom: 20px; width: 100%; padding: 0 4rem;
            display: flex; justify-content: space-between;
            color: rgba(255,255,255,0.8); font-size: 0.8rem;
        }
        .attribution a { color: white; text-decoration: underline; }

        /* Gallery Grid */
        .content-area { padding: 40px 4rem; text-align: center; }
        .grid { columns: 3 300px; column-gap: 20px; }

        .img-card {
            margin-bottom: 20px;
            border-radius: 8px;
            overflow: hidden;
            break-inside: avoid;
            background: #f0f0f0;
            position: relative;
            opacity: 0;
            transform: translateY(20px);
        }

        .img-card img { width: 100%; display: block; transition: 0.5s ease; cursor: pointer; }
        .img-card:hover img { transform: scale(1.05); }

        .img-label {
            position: absolute; bottom: 0; left: 0; width: 100%;
            padding: 15px; background: linear-gradient(transparent, rgba(0,0,0,0.7));
            color: white; font-size: 0.85rem; text-align: left;
            opacity: 0; transition: 0.3s;
        }
        .img-card:hover .img-label { opacity: 1; }

        #no-results { display: none; padding: 100px 20px; color: #888; font-size: 1.3rem; font-weight: 600; }

        @media (max-width: 900px) {
            nav, .attribution { padding: 1rem 2rem; }
            .hero h1 { font-size: 2rem; }
            .category-tabs { gap: 8px; }
            .cat-item { font-size: 0.8rem; padding: 4px 10px; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="logo">pixabay</a>
        <div class="nav-right">
            <select><option>Explore</option></select>
            <a href="#">Log in</a>
            <a href="#" class="btn-join">Join</a>
            <button class="btn-upload">↑ Upload</button>
        </div>
    </nav>

    <header class="hero">
        <h1>Stunning royalty-free images & royalty-free stock</h1>
        
        <div class="search-container">
            <div class="category-tabs" id="main-tabs">
                <a href="#" class="cat-item active" onclick="updateTab(event)">Explore</a>
                <a href="#" class="cat-item" onclick="updateTab(event)">Photos</a>
                <a href="#" class="cat-item" onclick="updateTab(event)">Illustrations</a>
                <a href="#" class="cat-item" onclick="updateTab(event)">Vectors</a>
                <a href="#" class="cat-item" onclick="updateTab(event)">Videos</a>
                <a href="#" class="cat-item" onclick="updateTab(event)">Music</a>
                <a href="#" class="cat-item" onclick="updateTab(event)">Sound Effects</a>
                <a href="#" class="cat-item" onclick="updateTab(event)">3D Models</a>
                <a href="#" class="cat-item" onclick="updateTab(event)">GIFs</a>
            </div>

            <form class="search-box" id="search-form">
                <input type="text" id="search-input" placeholder="Search for images, nature, flowers..." autocomplete="off">
                <button type="submit">Search</button>
            </form>

            <div class="tag-pills">
                <a href="#" class="pill" onclick="quickFilter('nature')">nature</a>
                <a href="#" class="pill" onclick="quickFilter('wallpaper')">wallpaper</a>
                <a href="#" class="pill" onclick="quickFilter('christmas')">christmas</a>
                <a href="#" class="pill" onclick="quickFilter('flowers')">flowers</a>
                <a href="#" class="pill" onclick="quickFilter('forest')">forest</a>
                <a href="#" class="pill" onclick="quickFilter('winter')">winter</a>
            </div>
        </div>

        <div class="attribution">
            <div>Free image by <a href="#">Oliver Nguyen</a></div>
            <div>Read more about the <a href="#">Content License</a></div>
        </div>
    </header>

    <main class="content-area">
        <div id="no-results">Oops! We couldn't find any matches.</div>
        <div class="grid" id="image-grid"></div>
    </main>

    <script>
        const photoData = [
            { name: "Deep Green Forest Path", url: "https://images.unsplash.com/photo-1542601906990-b4d3fb778b09?w=600", tags: ["nature", "forest", "green"] },
            { name: "Mountain Peak View", url: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=600", tags: ["nature", "mountain", "landscape"] },
            { name: "Golden Sunset Field", url: "https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=600", tags: ["nature", "sunset", "wallpaper"] },
            { name: "Winter Lake Reflection", url: "https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600", tags: ["winter", "nature", "lake"] },
            { name: "Spring Flowers", url: "https://images.unsplash.com/photo-1501854140801-50d01698950b?w=600", tags: ["flowers", "nature", "spring"] },
            { name: "Forest Mist", url: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600", tags: ["nature", "forest", "mist"] },
            { name: "Snowy Pine Trees", url: "https://images.unsplash.com/photo-1518173946687-a4c8892bbd9f?w=600", tags: ["winter", "christmas", "forest"] },
            { name: "Ocean Beach", url: "https://images.unsplash.com/photo-1475924156735-5123594611ad?w=600", tags: ["nature", "beach", "ocean"] },
            { name: "Christmas Background", url: "https://images.unsplash.com/photo-1505765050516-f72dcac9c60e?w=600", tags: ["flowers", "christmas", "background"] },
            { name: "Lavender Field", url: "https://images.unsplash.com/photo-1426604966848-d7adac402bff?w=600", tags: ["flowers", "nature", "lavender"] }
        ];

        const grid = document.getElementById('image-grid');
        const searchInput = document.getElementById('search-input');
        const noResults = document.getElementById('no-results');

        function renderGallery(items) {
            grid.innerHTML = '';
            if (items.length === 0) {
                noResults.style.display = 'block';
                return;
            }
            noResults.style.display = 'none';

            items.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'img-card';
                card.innerHTML = `
                    <img src="${item.url}" alt="${item.name}">
                    <div class="img-label">${item.name}</div>
                `;
                grid.appendChild(card);

                setTimeout(() => {
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                    card.style.transition = '0.6s ease';
                }, index * 60);
            });
        }

        // Search Form Logic
        document.getElementById('search-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const query = searchInput.value.toLowerCase().trim();
            const filtered = photoData.filter(photo => 
                photo.name.toLowerCase().includes(query) || 
                photo.tags.some(tag => tag.includes(query))
            );
            renderGallery(filtered);
        });

        // Quick Tag Logic
        function quickFilter(tag) {
            searchInput.value = tag;
            const filtered = photoData.filter(p => p.tags.includes(tag));
            renderGallery(filtered);
        }

        // Tab Switching Logic
        function updateTab(e) {
            e.preventDefault();
            document.querySelectorAll('.cat-item').forEach(el => el.classList.remove('active'));
            e.target.classList.add('active');
            
            // Simulates switching content by shuffling
            const shuffled = [...photoData].sort(() => 0.5 - Math.random());
            renderGallery(shuffled);
        }

        // Initial Load
        renderGallery(photoData);
    </script>
</body>
</html>
